<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>CAD Intelligence — рабочее окно</title>
  <link rel="stylesheet" href="/workspace.css">
  <script type="importmap">{"imports":{"three":"/vendor/three.module.min.js","three/addons/controls/OrbitControls.js":"/vendor/OrbitControls.js","three/addons/loaders/STLLoader.js":"/vendor/STLLoader.js"}}</script>
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>CAD Intelligence</span></div>
    <span class="header-separator"></span><span class="app-context">Рабочее окно</span>
    <div class="header-actions">
      <span class="connection" id="connection"><i></i> Локальный расчёт</span>
      <button type="button" id="open-file" class="button secondary"><span aria-hidden="true">＋</span> Открыть скан</button>
      <input type="file" id="file-input" accept=".stl,.obj,.ply" hidden>
    </div>
  </header>
  <main class="app-main">
    <section class="part-header" aria-label="Деталь">
      <div>
        <div class="part-title"><h1 id="part-name">Тестовый фланец</h1><span id="sample-tag" class="sample-tag" hidden>Тестовый скан</span></div>
        <p class="part-meta" id="part-meta">Загружается…</p>
        <p class="run-identity" id="run-identity"></p>
      </div>
      <div class="part-actions">
        <button id="run" class="button secondary" type="button" disabled><span aria-hidden="true">↻</span> <span id="run-label">Пересчитать</span></button>
        <a id="macro" class="button secondary" hidden>Макрос SolidWorks</a>
        <a id="step" class="button primary" aria-disabled="true"><span aria-hidden="true">↓</span> Скачать STEP</a>
      </div>
    </section>
    <p class="notice" id="notice" role="status" hidden></p>

    <div class="workspace">
      <aside class="sidebar panel" aria-label="Проект">
        <div class="panel-heading"><h2>Файлы</h2></div>
        <div class="file-list">
          <button class="file-entry" type="button" data-mode="scan">
            <span class="file-icon scan-icon" aria-hidden="true">⠿</span><span><b>Исходный скан</b><small id="scan-type">STL</small></span>
          </button>
          <button class="file-entry" type="button" data-mode="model">
            <span class="file-icon model-icon" aria-hidden="true">◇</span><span><b>CAD-модель</b><small id="model-type">STEP</small></span>
          </button>
        </div>
        <section class="sidebar-section">
          <h2>Параметры расчёта</h2>
          <label class="field-row"><span>Единицы</span><select id="units" aria-label="Единицы скана"><option value="mm">мм</option><option value="cm">см</option><option value="m">м</option><option value="in">дюймы</option></select></label>
          <div class="field-row"><span>Допуск</span><strong id="tolerance">—</strong></div>
          <div class="field-row dims"><span>Габариты, мм</span><strong id="dimensions">—</strong></div>
          <label class="notes-field"><span>Что сломано, что важно</span><textarea id="notes" rows="3" placeholder="Например: отколот угол фланца, отверстие в нём потеряно"></textarea></label>
          <label class="regions-option"><input id="ai" type="checkbox"> <span id="ai-label">Построить с ИИ</span></label>
          <p class="ai-note" id="ai-note"></p>
        </section>
        <section class="sidebar-section history">
          <h2>История</h2>
          <div id="history" class="history-list"></div>
        </section>
      </aside>

      <section class="canvas-panel panel" aria-label="3D-просмотр">
        <div class="canvas-toolbar">
          <div class="tabs" aria-label="Режим отображения">
            <button type="button" data-mode="scan">Скан</button>
            <button type="button" data-mode="compare">Сравнение</button>
            <button type="button" data-mode="model">Модель</button>
            <button type="button" data-mode="deviation">Отклонения</button>
          </div>
          <button type="button" class="icon-button" id="fit" title="Подогнать модель в кадр" aria-label="Подогнать модель в кадр">⌗</button>
        </div>
        <div class="deviation-controls tabs" id="directions" role="group" aria-label="Направление измерения отклонений" hidden>
          <button type="button" data-direction="model">Модель → скан</button>
          <button type="button" data-direction="scan">Скан → модель</button>
        </div>
        <div class="viewport" id="viewport">
          <div class="viewport-info" aria-hidden="true"><span class="view-dot"></span><span id="view-label">Изометрия</span></div>
          <div class="viewport-message" id="view-message" role="status">Загрузка геометрии…</div>
          <div class="axis" id="axis" aria-hidden="true"></div>
          <div class="legend" id="legend"></div>
          <div class="marker" id="marker" hidden aria-hidden="true"></div>
        </div>
        <div class="view-footer">
          <div class="views" aria-label="Ракурс">
            <button type="button" data-view="iso" aria-pressed="true">Изометрия</button>
            <button type="button" data-view="top" aria-pressed="false">Сверху</button>
            <button type="button" data-view="front" aria-pressed="false">Спереди</button>
          </div>
          <div class="section-controls"><input id="section-level" type="range" min="0" max="100" value="53" aria-label="Высота сечения" hidden>
            <button type="button" id="section" aria-pressed="false"><span aria-hidden="true">⫽</span> Сечение</button></div>
        </div>
      </section>

      <aside class="inspection panel" aria-label="Проверка результата">
        <div class="panel-heading"><h2>Проверка</h2><span class="inspection-state" id="inspection-state">Загрузка</span></div>
        <div id="inspection"></div>
      </aside>
    </div>

    <footer class="status-bar">
      <div class="stage-status"><i id="stage-dot"></i><strong id="stage" aria-live="polite">Загрузка рабочего окна</strong><span id="elapsed"></span><span id="attempts" class="attempt-summary"></span></div>
      <button type="button" id="journal" aria-expanded="false">Журнал <span aria-hidden="true">⌃</span></button>
    </footer>
    <pre id="log" class="log" tabindex="0" hidden></pre>
  </main>
  <script type="module" src="/workspace.js"></script>
</body>
</html>
